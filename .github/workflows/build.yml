name: Build mod
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.7.0
      - name: Descomprimir proyecto
        run: for z in *.zip; do unzip -q "$z" -d proj; done
      - name: Compilar
        working-directory: proj/RubiMod
        run: gradle build --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: rubimod-jar
          path: proj/RubiMod/build/libs/*.jar
